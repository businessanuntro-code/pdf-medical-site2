<!DOCTYPE html>
<html>

<head>

    <title>Upload XML</title>

</head>

<body>


<h3>Upload XML - Procesare articol stiintific</h3>

<form
    action="/upload/"
    method="post"
    enctype="multipart/form-data"
>

    <input
        type="file"
        name="file"
        accept=".xml"
    >

    <button type="submit">
        Upload
    </button>

</form>


<hr>


<h3>Upload XML - Procesare articol simplu</h3>

<form
    action="/upload-simple/"
    method="post"
    enctype="multipart/form-data"
>

    <input
        type="file"
        name="file"
        accept=".xml"
    >

    <button type="submit">
        Upload
    </button>

</form>


</body>

</html>
